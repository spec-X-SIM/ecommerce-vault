[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-vault"
version = "0.1.0"
description = "Read-only catalog for e-commerce data cleaning and visualization code."
readme = "README.md"
requires-python = ">=3.7"
authors = [{ name = "Author" }]

[project.scripts]
show-codes = "ecommerce_vault:show"